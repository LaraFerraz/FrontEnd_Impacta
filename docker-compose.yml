networks:
  impacta_network:
    driver: bridge

volumes:
  mysql_data:

services:

  mysql:
    image: mysql:8.0
    container_name: impacta_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - impacta_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./BackEnd_Impacta
    container_name: impacta_backend
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      API_HOST: ${API_HOST}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ./BackEnd_Impacta:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - impacta_network

  frontend:
    build:
      context: ./frontend-2026
    container_name: impacta_frontend
    restart: on-failure
    environment:
      WDS_SOCKET_HOST: localhost
      WDS_SOCKET_PORT: 443
      WDS_SOCKET_PATH: /ws
    depends_on:
      - backend
    networks:
      - impacta_network

  nginx:
    image: nginx:alpine
    container_name: impacta_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - impacta_network